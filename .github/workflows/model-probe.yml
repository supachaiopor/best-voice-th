name: Probe Thai model
on:
  workflow_dispatch:
  push:
    paths:
      - tools/model_probe.py
      - .github/workflows/model-probe.yml

permissions:
  contents: write

jobs:
  probe:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install CPU runtime
        run: python -m pip install torch==2.3.0 torchaudio==2.3.0 --index-url https://download.pytorch.org/whl/cpu
      - name: Install Thai engine
        run: python -m pip install f5-tts-th
      - name: Initialize and inspect model
        run: python tools/model_probe.py
      - name: Save model inventory to repository
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add model_probe.json
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -m "chore: save Thai model inventory [skip ci]"
            git push
          }
      - name: Upload model inventory
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: thai-model-probe
          path: model_probe.json
