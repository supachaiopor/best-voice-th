name: Export Thai ONNX models
on:
  workflow_dispatch:
  push:
    paths:
      - tools/export_thai_onnx.py
      - .github/workflows/export-onnx.yml

jobs:
  export:
    runs-on: windows-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install CPU PyTorch
        run: python -m pip install torch==2.3.0 torchaudio==2.3.0 --index-url https://download.pytorch.org/whl/cpu
      - name: Install Thai and ONNX export dependencies
        run: |
          python -m pip install f5-tts-th
          git clone --depth 1 https://github.com/DakeQQ/F5-TTS-ONNX.git build_work/F5-TTS-ONNX
          python -m pip install -r build_work/F5-TTS-ONNX/Export_ONNX/F5_TTS/requirements.txt
      - name: Export Thai checkpoint to ONNX
        run: python tools/export_thai_onnx.py
      - name: Verify model files
        shell: pwsh
        run: |
          $required = @("F5_Preprocess.onnx","F5_Transformer.onnx","F5_Decode.onnx","F5_Metadata.onnx","vocab.txt")
          foreach ($name in $required) {
            $path = Join-Path "onnx_models" $name
            if (-not (Test-Path $path)) { throw "Missing $path" }
            Write-Host "$name $((Get-Item $path).Length) bytes"
          }
      - name: Upload Thai ONNX bundle
        uses: actions/upload-artifact@v4
        with:
          name: best-voice-th-onnx
          path: onnx_models/
          compression-level: 6
          retention-days: 7
